name: Android CI (Build From WeTransfer)

on:
  workflow_dispatch: # بيسمح لك تشغل البناء يدوياً بزرار في أي وقت

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip

    - name: Download Project ZIP from WeTransfer
      run: |
        # سحب الملف مباشرة من رابط الوي ترانسفير بتاعك
        curl -L -o project.zip "https://we.tl/t-UrMYLcjmcAPEg85G"

    - name: Unzip Project Files
      run: |
        unzip project.zip -d temp_project
        # ترتيب الملفات لو مدفونة جوه فولدر فرعي
        if [ -d "temp_project/advertising (5)" ]; then
          mv temp_project/advertising\ \(5\)/* .
        elif [ -d "temp_project/app" ]; then
          mv temp_project/* .
        else
          mv temp_project/* .
        fi
        rm -rf temp_project project.zip

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          echo "gradlew not found, generating one..."
          gradle wrapper
          chmod +x gradlew
        fi

    - name: Build with Gradle
      run: ./gradlew assembleDebug

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yafta-app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk

