name: Android CI (Force Build Without Crash)

on:
  workflow_dispatch: 

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # إجبار جافا وجرادل على استخدام أقل حجم رامات ممكن لتفادي خطأ 9
  _JAVA_OPTIONS: "-Xmx1024m -Xms512m"
  GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx1024m -Dorg.gradle.daemon=false -Dorg.gradle.configureondemand=true"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y curl unzip

    - name: Download Project ZIP from WeTransfer
      run: |
        curl -L -o project.zip "https://we.tl/t-UrMYLcjmcAPEg85G"

    - name: Unzip Project Files
      run: |
        unzip project.zip -d temp_project
        if [ -d "temp_project/advertising (5)" ]; then
          mv temp_project/advertising\ \(5\)/* .
        elif [ -d "temp_project/app" ]; then
          mv temp_project/* .
        else
          mv temp_project/* .
        fi
        # مسح شامل لكل مخلفات البناء السابقة والملفات الثقيلة غير الضرورية
        rm -rf temp_project project.zip .gradle .build-outputs build app/build/outputs

    - name: set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Grant execute permission for gradlew
      run: |
        if [ -f "gradlew" ]; then
          chmod +x gradlew
        else
          echo "gradlew not found, generating one..."
          gradle wrapper
          chmod +x gradlew
        fi

    - name: Clean Gradle Cache
      run: ./gradlew clean --no-daemon

    # البناء بأقصى درجات الحماية وتوفير الذاكرة
    - name: Build with Gradle (Safe Mode)
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: yafta-app-debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
